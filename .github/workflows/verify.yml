name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: coopera_rls
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-rls.sh
        env:
          RLS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/coopera_rls
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/check-store-assets.mjs
      - run: npm run build
      - run: npm run build:mobile
      - name: Smoke web build
        shell: bash
        run: |
          npm run start > /tmp/coopera-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs
